  /* 레이아웃(v21, 10-26 PM 레퍼런스 기준): 한 칼럼(최대 520px) · 흰 바탕 · 섹션마다 배지→타이틀→설명 가운데 정렬 · 2열 카드 · 유의사항 목록 푸터. 히어로는 v20 그대로 */
  :root {
    /* 행사 브랜드 — 참고 SVG(10.2 디자인 중간 파이널)에 실제로 쓰인 값만 사용 */
    --pink: #FF8FFF;          /* 메인 핑크 (fill .s27) */
    --pink-light: #FFCDFF;    /* 가장 많이 쓰인 그라데이션 스톱 */
    --pink-mid: #F6CEFB;      /* 홀로 그라데이션 스톱 */
    --pink-pale: #FBF0FC;     /* 연핑크 면 fill */
    --magenta: #DD1AE2;       /* 홀로 레터링 외곽선 stroke */
    --magenta-deep: #A520A5;  /* 진마젠타 면 fill */
    --purple: #740CA5;        /* 스티커 외곽선 stroke */
    --yellow: #FFFFB4;        /* 메인 옐로 (fill) */
    --yellow-soft: #FFFFC5;   /* 옐로 밝은 면 fill */
    --yellow-pale: #FFFFE2;   /* 옐로 그라데이션 끝 */
    --yellow-line: #827F1A;   /* 옐로 면 외곽선 stroke */
    --blue: #0085FF;          /* 블루 면 fill (보조) */
    --grey: #EFEFEF;          /* 회색 면 fill */
    --grey-line: #B8BCC3;     /* 회색 면 fill */
    /* 앱 디자인 시스템 (app_colors.dart) */
    --orange: #EB5D34;
    --orange-pressed: #D24E28;
    --ink: #292A2B;
    --ink-2: #626873;
    --ink-3: #A6A9AD;
    --fill: #F6F6F7;
    --line: #EBECED;
    --border: #E0E0E0;
    --bg: #FFFFFF;
    --page-bg: #FBF0FC;
    /* 타이포 */
    --font-display: "ISCU", "Pretendard", "Noto Sans KR", sans-serif;
    --font-body: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    --radius: 12px;
    --radius-lg: 16px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --tab-h: 52px;
    color-scheme: light;
  }

(function () {
  const D = JSON.parse(document.getElementById('bbang-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* 히어로 안내 — 아이콘은 Figma(1:8)에서 가져온 라인 아이콘 3종 */
  const ICONS = {
    pin:   '<svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M11.25 7.5C11.25 8.74264 10.2426 9.75 9 9.75C7.75736 9.75 6.75 8.74264 6.75 7.5C6.75 6.25736 7.75736 5.25 9 5.25C10.2426 5.25 11.25 6.25736 11.25 7.5ZM15 7.5C15 10.8137 12 13.5 9 16.5C6 13.5 3 10.8137 3 7.5C3 4.18629 5.68629 1.5 9 1.5C12.3137 1.5 15 4.18629 15 7.5Z" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    clock: '<svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 5.55309V9.45309L11.6 10.7531M15.5 9.45309C15.5 13.0429 12.5899 15.9531 9 15.9531C5.41015 15.9531 2.5 13.0429 2.5 9.45309C2.5 5.86324 5.41015 2.95309 9 2.95309C12.5899 2.95309 15.5 5.86324 15.5 9.45309Z" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    gift:  '<svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 5.65619H6.075C5.64402 5.65619 5.2307 5.48498 4.92595 5.18024C4.6212 4.87549 4.45 4.46217 4.45 4.03119C4.45 3.60021 4.6212 3.18689 4.92595 2.88214C5.2307 2.57739 5.64402 2.40619 6.075 2.40619C8.35 2.40619 9 5.65619 9 5.65619ZM9 5.65619H11.925C12.356 5.65619 12.7693 5.48498 13.074 5.18024C13.3788 4.87549 13.55 4.46217 13.55 4.03119C13.55 3.60021 13.3788 3.18689 13.074 2.88214C12.7693 2.57739 12.356 2.40619 11.925 2.40619C9.65 2.40619 9 5.65619 9 5.65619ZM9 5.65619L9 15.4062M2.5 10.2062H15.5M2.5 8.90619V5.65619H15.5V8.90619M3.8 10.2062V13.4562C3.8 14.1562 3.8 14.5062 3.9375 14.7687C4.0581 14.9983 4.2508 15.1909 4.4804 15.3115C4.7429 15.4062 5.0929 15.4062 5.7929 15.4062H12.2071C12.9071 15.4062 13.2571 15.4062 13.5196 15.3115C13.7492 15.1909 13.9419 14.9983 14.0625 14.7687C14.2 14.5062 14.2 14.1562 14.2 13.4562V10.2062" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  $('hero-infos').innerHTML = (D.hero.infos || []).map((i) =>
    `<li>${ICONS[i.icon] || ''}<span class="vl">${esc(i.value)}</span></li>`).join('');

  /* 탭 */
  const tabs = $('tabs');
  let lockSpy = false, lockT;
  tabs.innerHTML = D.tabs.map((t, i) =>
    `<button class="tab" role="tab" id="tab-${esc(t.id)}" data-target="${esc(t.id)}" aria-selected="${i === 0}" aria-controls="${esc(t.id)}">${esc(t.label)}</button>`).join('');
  tabs.addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (!b) return;
    const sec = $(b.dataset.target); if (!sec) return;
    lockSpy = true; setActive(b.dataset.target);
    sec.scrollIntoView({ behavior: smooth(), block: 'start' });
    clearTimeout(lockT); lockT = setTimeout(() => { lockSpy = false; }, 900);
  });
  function setActive(id) {
    tabs.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.target === id)));
  }

  /* 섹션 머리(배지·타이틀·설명) — D.sections[탭 id], {count}는 업체 수 */
  const SEC_FALLBACK = { bakeries: '참여 업체', map: '공간 안내', events: '이벤트' };
  document.querySelectorAll('.sec-head[data-sec]').forEach((h) => {
    const id = h.dataset.sec, sc = (D.sections || {})[id] || {};
    const fill = (t) => esc(String(t || '').replace('{count}', `${D.bakeries.length}곳`));
    const desc = sc.desc || (id === 'map' ? D.map.note : '');
    h.innerHTML = `<span class="badge">${fill(sc.badge || SEC_FALLBACK[id])}</span>` +
      (sc.title === '' ? '' : `<h2 class="sec-title">${fill(sc.title || SEC_FALLBACK[id])}</h2>`) +
      (desc ? `<p class="sec-desc">${fill(desc)}</p>` : '');
  });

  /* 참여 업체 */
  const byBooth = {};
  $('cards').innerHTML = D.bakeries.map((b, i) => {
    byBooth[b.booth] = i;
    const label = `<span>${esc(D.ctaLabel || '상세보기')}</span><img class="chev" src="assets/icon-forward.png" alt="" width="42" height="42">`;
    const cta = b.id
      ? `<a class="cta" href="bbangmorning://bakery/${esc(b.id)}" data-bakery="${esc(b.id)}">${label}</a>`
      : `<button class="cta" type="button" data-popup="${i}">${label}</button>`;
    return `<article class="card" id="card-${i}" data-booth="${esc(b.booth)}">
      <div class="card-photo"><img src="${esc(b.photo)}" alt="${esc(b.name)} 대표 빵" loading="${i < 4 ? 'eager' : 'lazy'}"></div>
      <div class="card-body">
        <h3 class="card-name">${esc(b.name)}</h3>
        <p class="kv"><b>라인업</b>${esc(b.lineup)}</p>
        ${b.benefit ? `<p class="kv"><b>혜택</b>${esc(b.benefit)}</p>` : ''}
        ${cta}
      </div>
    </article>`;
  }).join('');

  /* 리스트 최하단 보조 버튼(D.moreCta) */
  if (D.moreCta && D.moreCta.label && D.moreCta.href) {
    const a = $('more-cta');
    a.href = D.moreCta.href;
    a.innerHTML = `<span>${esc(D.moreCta.label)}</span><img class="chev" src="assets/icon-forward.png" alt="" width="42" height="42">`;
    a.hidden = false;
  }

  /* 라인업 팝업 — 앱 상세 페이지가 없는 업체 */
  const modal = $('modal');
  let lastFocus = null;
  function openPopup(i) {
    const b = D.bakeries[i]; if (!b) return;
    $('sheet-photo').innerHTML = b.photo ? `<img src="${esc(b.photo)}" alt="${esc(b.name)} 대표 빵">` : '';
    $('sheet-photo').hidden = !b.photo;
    $('sheet-name').textContent = b.name;
    $('sheet-lineup').textContent = b.lineup || '';
    $('sheet-benefit-wrap').hidden = !b.benefit;
    $('sheet-benefit').textContent = b.benefit || '';
    lastFocus = document.activeElement;
    modal.hidden = false; document.body.style.overflow = 'hidden';
    $('sheet-close').focus();
  }
  function closePopup() {
    modal.hidden = true; document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $('cards').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-popup]'); if (!btn) return;
    openPopup(Number(btn.dataset.popup));
  });
  $('sheet-close').addEventListener('click', closePopup);
  $('modal-bg').addEventListener('click', closePopup);
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closePopup(); });

  /* 공간 안내 도면 — PM Figma 도면(Section.svg) 좌표 그대로, 층마다 svg 하나 */
  function el(tag, attrs, text) {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  // 여러 줄 라벨을 박스 가운데에 세로 정렬
  // 세로 가운데: dominant-baseline 은 iOS WebKit 이 무시하므로 기준선을 직접 계산(대략 글자 크기의 0.36 아래)
  function label(cx, cy, str, cls, lh, fs) {
    const arr = String(str).split('\n');
    const t = el('text', { x: cx, y: cy - ((arr.length - 1) * lh) / 2 + fs * 0.36, 'text-anchor': 'middle', class: cls });
    arr.forEach((ln, i) => t.appendChild(el('tspan', { x: cx, dy: i ? lh : 0 }, ln)));
    return t;
  }
  function pressable(g, fn, lb) {
    g.setAttribute('tabindex', 0); g.setAttribute('role', 'link'); g.setAttribute('aria-label', lb);
    g.addEventListener('click', fn);
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  }
  function jumpTo(target, tabId) {
    lockSpy = true; setActive(tabId);
    target.scrollIntoView({ behavior: smooth(), block: 'start' });
    clearTimeout(lockT); lockT = setTimeout(() => { lockSpy = false; }, 900);
  }
  const floorsEl = $('map-floors');
  /* 도면 스타일(PM 10-27 레퍼런스): 둥근 모서리 + 가는 검정 외곽선 + 단색 면(부스 옐로 / 존은 color 필드) ·
     계단은 가로 단 선, WC 는 화장실, 피크닉 존은 파라솔 아이콘, 출입문은 벽 위 흰 막대 + OUT/IN */
  const umbrella = (cx, cy, r) => {
    const g = el('g', { class: 'umbrella' });
    g.appendChild(el('circle', { cx, cy, r }));
    for (let k = 0; k < 8; k++) {
      const a = (Math.PI / 4) * k;
      g.appendChild(el('line', { x1: cx, y1: cy, x2: cx + r * Math.cos(a), y2: cy + r * Math.sin(a) }));
    }
    g.appendChild(el('circle', { cx, cy, r: 1.2, class: 'tip' }));
    return g;
  };
  (D.map.floors || []).forEach((f) => {
    const block = document.createElement('div'); block.className = 'floor-block';
    const h = document.createElement('h3'); h.className = 'floor-lb'; h.textContent = f.label; block.appendChild(h);
    const vb = f.viewBox || [0, 0, 390, 300];
    const svg = el('svg', { class: 'map-svg', viewBox: vb.join(' '), role: 'img', 'aria-label': `${f.label} 배치도` });
    (f.zones || []).forEach((z) => {
      const color = z.color || (z.type === 'stairs' ? 'grey' : z.type === 'wc' ? 'white' : 'yellow');
      const g = el('g', { class: `zone zone-${z.type} c-${color}` });
      if (z.type === 'event') pressable(g, () => jumpTo($('events'), 'events'), `${z.label} — 이벤트 안내로 이동`);
      g.appendChild(el('rect', { x: z.x, y: z.y, width: z.w, height: z.h, rx: 6 }));
      if (z.type === 'stairs') { /* 계단 — 가로 단 + 가운데 난간선 */
        for (let y = z.y + 9; y < z.y + z.h - 4; y += 9) g.appendChild(el('line', { class: 'step', x1: z.x + 3, y1: y, x2: z.x + z.w - 3, y2: y }));
        g.appendChild(el('line', { class: 'step', x1: z.x + z.w / 2, y1: z.y + 3, x2: z.x + z.w / 2, y2: z.y + z.h - 3 }));
      }
      if (z.umbrellas) { /* 피크닉 존 — 네 귀퉁이 파라솔 */
        const r = 10, px = z.x + r + 7, py = z.y + r + 7, qx = z.x + z.w - r - 7, qy = z.y + z.h - r - 7;
        [[px, py], [qx, py], [px, qy], [qx, qy]].forEach(([cx, cy]) => g.appendChild(umbrella(cx, cy, r)));
      }
      if (z.type !== 'stairs') g.appendChild(label(z.x + z.w / 2, z.y + z.h / 2, z.label, 'zone-lb' + (z.type === 'wc' ? ' wc-lb' : ''), 14, 12));
      else g.appendChild(label(z.x + z.w / 2, z.y + z.h / 2, z.label, 'zone-lb stairs-lb', 14, 12));
      svg.appendChild(g);
    });
    (f.booths || []).forEach((bt) => {
      const idx = bt.booth != null ? byBooth[bt.booth] : undefined;
      const b = idx != null ? D.bakeries[idx] : null;
      const nm = bt.label || (b ? b.name : '');
      const g = el('g', { class: 'booth' + (b ? ' link' : '') });
      if (b) pressable(g, () => {
        const card = $(`card-${idx}`); if (!card) return;
        jumpTo(card, 'bakeries');
        card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
      }, `${b.name} 부스 — 업체 카드로 이동`);
      g.appendChild(el('rect', { x: bt.x, y: bt.y, width: bt.w, height: bt.h, rx: 5 }));
      g.appendChild(label(bt.x + bt.w / 2, bt.y + bt.h / 2, nm, 'booth-lb', 12, 10));
      svg.appendChild(g);
    });
    (f.walls || []).forEach((d) => svg.appendChild(el('path', { class: 'wall', d })));
    [].concat(f.entrance || []).forEach((d) => svg.appendChild(el('path', { class: 'arrow', d })));
    (f.doors || []).forEach((dr) => { /* 출입문 — 벽 위 흰 막대 + 방향 글자 */
      const g = el('g', { class: 'door' });
      g.appendChild(el('rect', { x: dr.x, y: dr.y, width: dr.w, height: dr.h, rx: 2 }));
      const cx = dr.side === 'right' ? dr.x + dr.w + 12 : dr.side === 'left' ? dr.x - 12 : dr.x + dr.w / 2;
      const cy = (dr.side === 'right' || dr.side === 'left') ? dr.y + dr.h / 2 : dr.y + dr.h + 11;
      g.appendChild(label(cx, cy, dr.label, 'door-lb', 11, 10));
      svg.appendChild(g);
    });
    block.appendChild(svg); floorsEl.appendChild(block);
  });

  /* 공간 안내 — 도면 아래 웨이팅 등록 안내(PM 10-27 이미지 원문) */
  (function renderWaiting() {
    const w = D.map.waiting; const box = $('waiting');
    if (!w) { box.hidden = true; return; }
    const marker = (kind, i) => kind === 'num' ? `<i class="wn">${i + 1}</i>` : kind === 'star' ? `<i class="ws" aria-hidden="true">★</i>` : '';
    box.innerHTML = `
      <div class="wait-head">
        <h3 class="wait-title">${esc(w.title)}</h3>
        ${w.image ? `<img class="wait-img" src="${esc(w.image)}" alt="" loading="lazy">` : ''}
      </div>
      ${(w.groups || []).map((g) => `
        <div class="wait-card${g.tone === 'pink' ? ' pink' : ''}">
          <span class="wait-tag">${esc(g.tag)}</span>
          <ul class="wait-lines ${esc(g.kind || 'text')}">${(g.lines || []).map((l, i) => `<li>${marker(g.kind, i)}<span>${esc(l)}</span></li>`).join('')}</ul>
        </div>`).join('')}`;
  })();

  /* 이벤트 — 설명의 "라벨: 내용" 줄은 카드 그리드로, 나머지 줄은 문단으로 */
  function eventDesc(desc) {
    const lines = String(desc || '').split('\n').map((l) => l.trim()).filter(Boolean);
    const items = [], paras = [];
    lines.forEach((l) => { const m = l.match(/^([^:：]{1,12})[:：]\s*(.+)$/); (m ? items : paras).push(m ? m : l); });
    return (paras.length ? `<p class="event-desc">${esc(paras.join('\n'))}</p>` : '') +
      (items.length ? `<div class="event-items${items.length === 1 ? ' one' : ''}">${items.map((m) => `<div class="event-item"><b>${esc(m[1])}</b><span>${esc(m[2])}</span></div>`).join('')}</div>` : '');
  }
  /* 구조형 혜택 카드 — items[{label, text, images[]}] (PM 10-27 빵모닝 존·토스 존) */
  function eventItems(ev) {
    const items = ev.items || [];
    if (!items.length) return '';
    const one = ev.itemsCols === 1 || items.length === 1;
    return `<div class="event-items${one ? ' one' : ''}">${items.map((it) => `
      <div class="event-item${one ? ' wide' : ''}">
        <b>${esc(it.label)}</b><span>${esc(it.text)}</span>
        ${(it.images || []).length ? `<div class="item-imgs n${it.images.length}"${it.imgWidth ? ` style="width:${esc(it.imgWidth)};margin-inline:auto"` : ''}>${it.images.map((s) => `<img src="${esc(s)}" alt="" loading="lazy">`).join('')}</div>` : ''}
      </div>`).join('')}</div>`;
  }
  $('event-list').innerHTML = D.events.map((ev) =>
    `<article class="event">
      <h3 class="event-title">${esc(ev.title)}</h3>
      ${eventDesc(ev.desc)}
      ${eventItems(ev)}
      ${ev.time ? `<p class="event-time">${esc(ev.time)}</p>` : ''}
      ${ev.image ? `<div class="event-img ${ev.imageFit === 'contain' ? 'contain' : ''}"${ev.aspect ? ` style="aspect-ratio:${esc(ev.aspect)}"` : ''}><img src="${esc(ev.image)}" alt="${esc(ev.title)}" loading="lazy"></div>` : ''}
    </article>`).join('');

  /* 푸터 */
  $('foot-host').textContent = String(D.footer.host || '').replace('{count}', `${D.bakeries.length}곳`); $('foot-host').hidden = !D.footer.host;
  document.querySelector('.foot .meta').hidden = !(D.footer.host || D.footer.contact);
  $('foot-contact').textContent = D.footer.contact || ''; $('foot-contact').hidden = !D.footer.contact;
  $('foot-notes').innerHTML = (D.footer.notes || []).map((n) => `<li>${esc(n)}</li>`).join('');

  /* 스크롤 스파이 */
  const secs = D.tabs.map((t) => $(t.id)).filter(Boolean);
  function spy() {
    if (lockSpy) return;
    const line = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tab-h')) || 52) + 24;
    let cur = secs[0].id;
    for (const s of secs) { if (s.getBoundingClientRect().top - line <= 0) cur = s.id; }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8) cur = secs[secs.length - 1].id;
    setActive(cur);
  }
  addEventListener('scroll', spy, { passive: true });
  addEventListener('resize', spy);
  spy();

  /* 링크로 들어온 해시(#map 등) */
  const h = location.hash.replace('#', '');
  if (h && D.tabs.some((t) => t.id === h)) { requestAnimationFrame(() => { $(h).scrollIntoView({ block: 'start' }); setActive(h); }); }
})();
</script>
</body>
</html>
