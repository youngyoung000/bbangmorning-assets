<style>
  /* 레이아웃: 한 칼럼(최대 520px) · 히어로는 마젠타→핑크 그라데이션 + 옐로 안내 카드 · 탭 상단 고정 · 업체 카드 2열 */
  :root {
    /* 행사 브랜드 (참고 SVG) — 핑크·옐로 중심 */
    --pink: #FF8FFF;
    --pink-light: #FFC2FF;
    --pink-pale: #FFEAFF;
    --magenta: #DD1AE2;
    --magenta-deep: #B812BC;
    --yellow: #FFF27A;
    --yellow-soft: #FFFFB4;
    --yellow-pale: #FFFCE3;
    --blue: #0085FF;
    /* 앱 디자인 시스템 (app_colors.dart) */
    --orange: #EB5D34;
    --orange-pressed: #D24E28;
    --ink: #292A2B;
    --ink-2: #626873;
    --ink-3: #A6A9AD;
    --fill: #F6F6F7;
    --line: #EBECED;
    --border: #E0E0E0;
    --bg: #FFFFFF;
    --page-bg: #FFF7FA;
    /* 타이포 */
    --font-display: "Bagel Fat One", "Pretendard", "Noto Sans KR", sans-serif;
    --font-body: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    --radius: 12px;
    --radius-lg: 16px;
    --gutter-l: max(20px, env(safe-area-inset-left, 0px));
    --gutter-r: max(20px, env(safe-area-inset-right, 0px));
    --tab-h: 56px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .card.flash { animation: none; } }
  body {
    margin: 0; background: var(--page-bg); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    overflow-wrap: anywhere; word-break: keep-all;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 30; background: var(--bg);
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; }

  .page { max-width: 520px; margin: 0 auto; background: var(--bg); min-height: 100%; position: relative; }
  @media (min-width: 560px) {
    .page { box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(221, 26, 226, .10); }
  }
  .wrap { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

  /* ---------- 초안 띠 ---------- */
  .draft {
    background: var(--ink); color: #fff; font-size: 12px; font-weight: 700;
    padding-block: 7px; text-align: center; letter-spacing: .01em;
  }

  /* ---------- 히어로 ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(180deg, #D81CDC 0%, #F455F7 42%, var(--pink) 78%, var(--pink-light) 100%);
  }
  .hero-in { position: relative; z-index: 2; padding-block: 18px 0; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .hero-top img { height: 30px; width: auto; filter: drop-shadow(0 2px 6px rgba(120, 0, 130, .25)); }
  .hero-logo { margin: 18px auto 0; width: min(80%, 320px); position: relative; }
  .hero-logo img { width: 100%; height: auto; filter: drop-shadow(0 0 5px rgba(255, 255, 255, .95)) drop-shadow(0 10px 20px rgba(140, 0, 150, .28)); }
  .hero-art { position: absolute; pointer-events: none; z-index: 1; }
  .hero-cloud { left: -60px; top: 92px; width: 190px; opacity: .55; mix-blend-mode: screen; }
  .hero-cookie { right: 2px; top: 168px; width: 68px; transform: rotate(14deg); z-index: 3; filter: drop-shadow(0 6px 10px rgba(120, 0, 130, .3)); }
  .hero-infos {
    margin: 18px 0 0; padding: 12px 14px; list-style: none;
    background: var(--yellow); color: var(--ink); border-radius: var(--radius-lg);
    display: grid; gap: 7px; box-shadow: 0 8px 20px rgba(120, 0, 130, .18);
  }
  .hero-infos li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.35; }
  .hero-infos .ic { flex: none; width: 20px; text-align: center; font-size: 13px; line-height: 1.35; }
  .hero-infos .lb { font-weight: 800; color: var(--magenta-deep); flex: none; min-width: 28px; }
  .hero-infos .vl { font-weight: 500; min-width: 0; }
  .hero-sponsor {
    position: relative; z-index: 2; margin-top: 18px; background: var(--magenta-deep);
    display: flex; justify-content: center; align-items: center; padding-block: 11px;
  }
  .hero-sponsor img { height: 22px; width: auto; }

  /* ---------- 고정 탭 ---------- */
  .tabs {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: rgba(255, 255, 255, .96); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line); height: var(--tab-h);
    display: flex; align-items: center; gap: 8px;
  }
  .tab {
    appearance: none; border: 1px solid var(--border); background: var(--bg); color: var(--ink-2);
    font: inherit; font-size: 14px; font-weight: 700; line-height: 1;
    height: 36px; padding: 0 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab:hover { border-color: var(--magenta); color: var(--magenta-deep); }
  .tab[aria-selected="true"] { background: var(--magenta); border-color: var(--magenta); color: #fff; }

  /* ---------- 섹션 공통 ---------- */
  section.block { padding-block: 30px 8px; scroll-margin-top: calc(var(--tab-h) + env(safe-area-inset-top, 0px)); }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 16px; }
  .sec-title {
    margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; letter-spacing: .01em;
    position: relative; display: inline-block; isolation: isolate; color: var(--ink);
  }
  .sec-title::after {
    content: ""; position: absolute; left: -4px; right: -4px; bottom: 1px; height: 12px; z-index: -1;
    background: var(--yellow); border-radius: 6px; transform: skewX(-8deg);
  }
  .sec-count { font-size: 13px; font-weight: 700; color: var(--ink-3); }
  .sec-note { margin: -6px 0 14px; font-size: 13px; color: var(--ink-2); }

  /* ---------- 참여 업체 카드 (2열) ---------- */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: 0 6px 18px rgba(41, 42, 43, .05); min-width: 0;
    display: flex; flex-direction: column;
    scroll-margin-top: calc(var(--tab-h) + env(safe-area-inset-top, 0px) + 12px);
  }
  .card.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--magenta); } 100% { box-shadow: 0 6px 18px rgba(41, 42, 43, .05); } }
  .card-photo { position: relative; aspect-ratio: 1 / 1; max-width: 100%; background: var(--fill); }
  .card-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .booth-tag {
    position: absolute; left: 8px; top: 8px; font-family: var(--font-display); font-size: 12px; letter-spacing: .04em;
    color: var(--ink); background: var(--yellow); padding: 5px 8px 4px; border-radius: 999px; line-height: 1;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
  }
  .card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-region { font-size: 11px; font-weight: 700; color: var(--magenta-deep); margin: 0; }
  .card-name { font-size: 15px; font-weight: 800; line-height: 1.25; margin: -3px 0 0; color: var(--ink); }
  .card-lineup {
    margin: 0; font-size: 12px; line-height: 1.4; color: var(--ink-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-lineup b { color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .benefit {
    display: flex; gap: 5px; align-items: flex-start; font-size: 12px; line-height: 1.35; color: var(--ink);
    background: var(--yellow-pale); border: 1px solid var(--yellow); border-radius: 10px; padding: 7px 8px;
  }
  .benefit .em { flex: none; font-size: 12px; }
  .benefit b { color: var(--magenta-deep); font-weight: 800; margin-right: 3px; }
  .cta {
    display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: auto;
    height: 40px; border-radius: 10px; background: var(--orange); color: #fff;
    font-size: 13px; font-weight: 800; text-decoration: none; white-space: nowrap;
    transition: background .15s;
  }
  .cta:active { background: var(--orange-pressed); }
  .cta svg { width: 14px; height: 14px; }

  /* ---------- 공간 안내 ---------- */
  .map-wrap { background: var(--pink-pale); border-radius: var(--radius-lg); padding: 12px; border: 1px solid var(--pink-light); }
  .map-svg { width: 100%; height: auto; display: block; max-width: 100%; }
  .map-svg text { font-family: var(--font-body); }
  .map-svg .zone-lb { font-size: 12px; font-weight: 800; fill: var(--ink); }
  .map-svg .zone-sub { font-size: 9px; font-weight: 500; fill: var(--ink-2); }
  .map-svg .booth { cursor: pointer; }
  .map-svg .booth rect { fill: #fff; stroke: var(--magenta); stroke-width: 1.5; transition: fill .15s; }
  .map-svg .booth:hover rect, .map-svg .booth:focus rect { fill: var(--pink-pale); }
  .map-svg .booth .code { font-family: var(--font-display); font-size: 10px; fill: var(--magenta); letter-spacing: .04em; }
  .map-svg .booth .nm { font-size: 9px; font-weight: 700; fill: var(--ink); }
  .map-svg .zone rect { stroke-width: 1.5; }
  .map-svg .zone-event rect { fill: var(--pink-light); stroke: var(--pink); }
  .map-svg .zone-photo rect { fill: #fff; stroke: var(--magenta); stroke-dasharray: 4 3; }
  .map-svg .zone-eat rect { fill: var(--yellow); stroke: #E6D96A; }
  .map-svg .zone-info rect { fill: var(--yellow-soft); stroke: #E6D96A; }
  .map-svg .zone-toilet rect { fill: #E9EBEF; stroke: #B9BEC7; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 12px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid; display: inline-block; }

  /* ---------- 이벤트 ---------- */
  .events { display: grid; gap: 22px; }
  .event { display: grid; gap: 10px; }
  .event-img {
    position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--radius-lg); overflow: hidden;
    background: linear-gradient(160deg, var(--yellow-pale), var(--pink-pale));
  }
  .event-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .event-img.contain img {
    inset: 18px; width: calc(100% - 36px); height: calc(100% - 36px); object-fit: contain;
    filter: drop-shadow(0 10px 18px rgba(221, 26, 226, .18));
  }
  .event-zone {
    display: inline-flex; justify-self: start; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 800; color: var(--magenta-deep); background: var(--yellow);
    border-radius: 999px; padding: 4px 10px; letter-spacing: .01em;
  }
  .event-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1.15; letter-spacing: .01em; text-wrap: balance; color: var(--ink); }
  .event-desc { margin: 0; color: var(--ink-2); font-size: 15px; }
  .event-time { margin: 0; font-size: 13px; font-weight: 700; color: var(--magenta-deep); display: flex; gap: 6px; align-items: center; }
  .event-time::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--magenta); }

  /* ---------- 푸터 ---------- */
  footer.foot {
    margin-top: 36px; background: var(--yellow-pale); border-top: 1px solid var(--yellow);
    padding-block: 24px calc(28px + env(safe-area-inset-bottom, 0px));
    font-size: 13px; color: var(--ink-2);
  }
  .foot ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 6px; }
  .foot p { margin: 0 0 4px; }
  .foot .brand { font-family: var(--font-display); font-size: 18px; color: var(--ink); margin-bottom: 10px; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="page">
  <div class="draft wrap" id="draft" hidden></div>

  <header class="hero" id="top">
    <img class="hero-art hero-cloud" src="assets/cloud-pink.webp" alt="">
    <img class="hero-art hero-cookie" src="assets/bbang-cookie.webp" alt="">
    <div class="wrap hero-in">
      <div class="hero-top">
        <img src="assets/logo-newbbangworld.webp" alt="NEW BBANG WORLD" width="512" height="118">
        <img src="assets/logo-date.webp" alt="2026 10.30 – 11.01 FRI – SUN" width="585" height="118">
      </div>
      <div class="hero-logo"><img src="assets/logo-bbangryeok.webp" alt="빵력장터" width="803" height="273"></div>
      <ul class="hero-infos" id="hero-infos"></ul>
    </div>
    <div class="hero-sponsor"><img src="assets/logo-sponsor.webp" alt="빵모닝 × toss" width="523" height="82"></div>
  </header>

  <nav class="tabs wrap" id="tabs" role="tablist" aria-label="안내 메뉴"></nav>

  <main>
    <section class="block wrap" id="bakeries">
      <div class="sec-head">
        <h2 class="sec-title">참여 업체</h2>
        <span class="sec-count" id="bakery-count"></span>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <section class="block wrap" id="map">
      <div class="sec-head"><h2 class="sec-title">공간 안내</h2></div>
      <p class="sec-note" id="map-note"></p>
      <div class="map-wrap">
        <svg class="map-svg" id="map-svg" viewBox="0 0 360 300" role="img" aria-label="빵력장터 행사장 배치도"></svg>
        <ul class="legend">
          <li><i style="background:#fff;border-color:var(--magenta)"></i>빵집 부스</li>
          <li><i style="background:var(--pink-light);border-color:var(--pink)"></i>이벤트존</li>
          <li><i style="background:#fff;border-color:var(--magenta);border-style:dashed"></i>포토존</li>
          <li><i style="background:var(--yellow);border-color:#E6D96A"></i>취식존</li>
          <li><i style="background:var(--yellow-soft);border-color:#E6D96A"></i>안내</li>
          <li><i style="background:#E9EBEF;border-color:#B9BEC7"></i>화장실</li>
        </ul>
      </div>
    </section>

    <section class="block wrap" id="events">
      <div class="sec-head"><h2 class="sec-title">이벤트</h2></div>
      <div class="events" id="event-list"></div>
    </section>
  </main>

  <footer class="foot wrap">
    <div class="brand">빵력장터 · NEW BBANG WORLD</div>
    <p id="foot-host"></p>
    <p id="foot-contact"></p>
    <ul id="foot-notes"></ul>
  </footer>
</div>

<script>
(function () {
  const D = JSON.parse(document.getElementById('bbang-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SVG = 'http://www.w3.org/2000/svg';
  const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

  /* 초안 띠 */
  if (D.meta && D.meta.draft) { $('draft').textContent = D.meta.draftNote || '초안 미리보기'; $('draft').hidden = false; }

  /* 히어로 안내 */
  $('hero-infos').innerHTML = (D.hero.infos || []).map((i) =>
    `<li><span class="ic">${esc(i.icon)}</span><span class="lb">${esc(i.label)}</span><span class="vl">${esc(i.value)}</span></li>`).join('');

  /* 탭 */
  const tabs = $('tabs');
  let lockSpy = false, lockT;
  tabs.innerHTML = D.tabs.map((t, i) =>
    `<button class="tab" role="tab" id="tab-${esc(t.id)}" data-target="${esc(t.id)}" aria-selected="${i === 0}" aria-controls="${esc(t.id)}">${esc(t.label)}</button>`).join('');
  tabs.addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (!b) return;
    const sec = $(b.dataset.target); if (!sec) return;
    lockSpy = true; setActive(b.dataset.target);
    sec.scrollIntoView({ behavior: smooth(), block: 'start' });
    clearTimeout(lockT); lockT = setTimeout(() => { lockSpy = false; }, 900);
  });
  function setActive(id) {
    tabs.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.target === id)));
  }

  /* 참여 업체 */
  const byBooth = {};
  $('bakery-count').textContent = `${D.bakeries.length}곳`;
  $('cards').innerHTML = D.bakeries.map((b, i) => {
    byBooth[b.booth] = b;
    return `<article class="card" id="bakery-${esc(b.id)}" data-booth="${esc(b.booth)}">
      <div class="card-photo">
        <img src="${esc(b.photo)}" alt="${esc(b.name)} 대표 빵" loading="${i < 4 ? 'eager' : 'lazy'}">
        <span class="booth-tag">${esc(b.booth)}</span>
      </div>
      <div class="card-body">
        <p class="card-region">${esc(b.region)}</p>
        <h3 class="card-name">${esc(b.name)}</h3>
        <p class="card-lineup"><b>라인업</b>${esc(b.lineup)}</p>
        ${b.benefit ? `<div class="benefit"><span class="em">🎁</span><div><b>혜택</b>${esc(b.benefit)}</div></div>` : ''}
        <a class="cta" href="bbangmorning://bakery/${esc(b.id)}" data-bakery="${esc(b.id)}">${esc(D.ctaLabel || '라인업 상세보기')}
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </article>`;
  }).join('');

  /* 공간 안내 도면 */
  $('map-note').textContent = D.map.note || '';
  const svg = $('map-svg');
  function el(tag, attrs, text) {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  svg.appendChild(el('rect', { x: 4, y: 4, width: 352, height: 266, rx: 14, fill: '#fff', stroke: '#E8C9EA', 'stroke-width': 2 }));
  (D.map.zones || []).forEach((z) => {
    const g = el('g', { class: `zone zone-${z.type}` });
    g.appendChild(el('rect', { x: z.x, y: z.y, width: z.w, height: z.h, rx: 10 }));
    const cx = z.x + z.w / 2, cy = z.y + z.h / 2;
    const icon = { event: '🎉', photo: '📸', eat: '🍞', info: 'ℹ️', toilet: '🚻' }[z.type] || '';
    g.appendChild(el('text', { x: cx, y: cy - (z.sub ? 6 : -4), 'text-anchor': 'middle', class: 'zone-lb' }, `${icon} ${z.label}`));
    if (z.sub) g.appendChild(el('text', { x: cx, y: cy + 10, 'text-anchor': 'middle', class: 'zone-sub' }, z.sub));
    svg.appendChild(g);
  });
  (D.map.booths || []).forEach((bt) => {
    const b = byBooth[bt.booth];
    const g = el('g', { class: 'booth', tabindex: 0, role: 'link', 'aria-label': `${bt.booth} ${b ? b.name : ''} 부스` });
    g.appendChild(el('rect', { x: bt.x, y: bt.y, width: bt.w, height: bt.h, rx: 8 }));
    const cx = bt.x + bt.w / 2;
    g.appendChild(el('text', { x: cx, y: bt.y + 14, 'text-anchor': 'middle', class: 'code' }, bt.booth));
    const nm = b ? b.name : '';
    g.appendChild(el('text', { x: cx, y: bt.y + 27, 'text-anchor': 'middle', class: 'nm' }, nm.length > 8 ? nm.slice(0, 8) + '…' : nm));
    const go = () => {
      if (!b) return;
      const card = $(`bakery-${b.id}`); if (!card) return;
      lockSpy = true; setActive('bakeries');
      card.scrollIntoView({ behavior: smooth(), block: 'start' });
      card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
      clearTimeout(lockT); lockT = setTimeout(() => { lockSpy = false; }, 900);
    };
    g.addEventListener('click', go);
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    svg.appendChild(g);
  });
  if (D.map.entrance) {
    const e = D.map.entrance;
    svg.appendChild(el('rect', { x: e.x - 44, y: 262, width: 88, height: 16, rx: 4, fill: 'var(--magenta)' }));
    svg.appendChild(el('text', { x: e.x, y: 274, 'text-anchor': 'middle', fill: '#fff', 'font-size': 10, 'font-weight': 800 }, `▲ ${e.label}`));
    svg.appendChild(el('text', { x: e.x, y: 294, 'text-anchor': 'middle', fill: 'var(--ink-3)', 'font-size': 9, 'font-weight': 600 }, '이 화면 아래쪽이 입구 방향이에요'));
  }

  /* 이벤트 */
  $('event-list').innerHTML = D.events.map((ev) =>
    `<article class="event">
      <div class="event-img ${ev.imageFit === 'contain' ? 'contain' : ''}"><img src="${esc(ev.image)}" alt="${esc(ev.title)}" loading="lazy"></div>
      <span class="event-zone">📍 ${esc(ev.zone)}</span>
      <h3 class="event-title">${esc(ev.title)}</h3>
      <p class="event-desc">${esc(ev.desc)}</p>
      ${ev.time ? `<p class="event-time">${esc(ev.time)}</p>` : ''}
    </article>`).join('');

  /* 푸터 */
  $('foot-host').textContent = D.footer.host || '';
  $('foot-contact').textContent = D.footer.contact || '';
  $('foot-notes').innerHTML = (D.footer.notes || []).map((n) => `<li>${esc(n)}</li>`).join('');

  /* 스크롤 스파이 */
  const secs = D.tabs.map((t) => $(t.id)).filter(Boolean);
  function spy() {
    if (lockSpy) return;
    const line = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tab-h')) || 56) + 24;
    let cur = secs[0].id;
    for (const s of secs) { if (s.getBoundingClientRect().top - line <= 0) cur = s.id; }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8) cur = secs[secs.length - 1].id;
    setActive(cur);
  }
  addEventListener('scroll', spy, { passive: true });
  addEventListener('resize', spy);
  spy();

  /* 링크로 들어온 해시(#map 등) */
  const h = location.hash.replace('#', '');
  if (h && D.tabs.some((t) => t.id === h)) { requestAnimationFrame(() => { $(h).scrollIntoView({ block: 'start' }); setActive(h); }); }
})();
</script>
</body>
</html>
